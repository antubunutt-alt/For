<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkNet Admin | System Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #141414;
            --border-color: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --accent-green: #00ff41;
            --accent-red: #ff0040;
            --accent-blue: #00bfff;
            --accent-yellow: #ffcc00;
            --font-mono: 'Share Tech Mono', monospace;
            --font-display: 'Orbitron', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 50%), var(--bg-primary);
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
        }

        .auth-box h1 {
            font-family: var(--font-display);
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent-green);
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }

        .auth-box h1 i {
            display: block;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00cc33, var(--accent-green));
            border: none;
            border-radius: 6px;
            color: var(--bg-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .admin-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-header h1 {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-nav {
            display: flex;
            gap: 5px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 255, 65, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255, 0, 64, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            color: var(--accent-red);
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 64, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 64, 0.3);
        }

        .admin-content {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .stat-icon.green { background: rgba(0, 255, 65, 0.1); color: var(--accent-green); }
        .stat-icon.blue { background: rgba(0, 191, 255, 0.1); color: var(--accent-blue); }
        .stat-icon.yellow { background: rgba(255, 204, 0, 0.1); color: var(--accent-yellow); }
        .stat-icon.red { background: rgba(255, 0, 64, 0.1); color: var(--accent-red); }

        .stat-info h3 {
            font-size: 32px;
            font-family: var(--font-display);
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tables */
        .section-title {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--accent-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .data-table {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: var(--bg-secondary);
            padding: 15px;
            text-align: left;
            font-size: 12px;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 15px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .data-table tr:hover td {
            background: rgba(0, 255, 65, 0.05);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge.online {
            background: rgba(0, 255, 65, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-badge.offline {
            background: rgba(255, 0, 64, 0.1);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .status-badge.banned {
            background: rgba(255, 0, 64, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--font-mono);
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-edit {
            background: rgba(0, 191, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .btn-edit:hover {
            background: rgba(0, 191, 255, 0.2);
        }

        .btn-ban {
            background: rgba(255, 204, 0, 0.1);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
        }

        .btn-ban:hover {
            background: rgba(255, 204, 0, 0.2);
        }

        .btn-delete {
            background: rgba(255, 0, 64, 0.1);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .btn-delete:hover {
            background: rgba(255, 0, 64, 0.2);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-family: var(--font-display);
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--accent-red);
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-green);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 15px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-left: 3px solid var(--accent-green); }
        .toast.error { border-left: 3px solid var(--accent-red); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .admin-nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .data-table {
                overflow-x: auto;
            }

            .data-table table {
                min-width: 800px;
            }
        }

        .hidden { display: none !important; }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-box">
            <h1>
                <i class="fas fa-shield-alt"></i>
                ADMIN CONTROL
            </h1>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="admin-username" placeholder="Admin Username" value="admin">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="admin-password" placeholder="Admin Password">
            </div>
            <button class="btn-primary" onclick="adminLogin()">
                <i class="fas fa-sign-in-alt"></i> ACCESS CONTROL PANEL
            </button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <header class="admin-header">
            <h1><i class="fas fa-shield-alt"></i> SYSTEM CONTROL PANEL</h1>
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="showTab('users')">
                    <i class="fas fa-users"></i> Users
                </button>
                <button class="nav-btn" onclick="showTab('stats')">
                    <i class="fas fa-chart-bar"></i> Statistics
                </button>
                <button class="nav-btn" onclick="showTab('logs')">
                    <i class="fas fa-history"></i> Logs
                </button>
                <button class="nav-btn" onclick="showTab('broadcast')">
                    <i class="fas fa-bullhorn"></i> Broadcast
                </button>
            </nav>
            <button class="logout-btn" onclick="adminLogout()">
                <i class="fas fa-power-off"></i> DISCONNECT
            </button>
        </header>

        <div class="admin-content">
            <!-- Stats Tab -->
            <div id="tab-stats" class="tab-content">
                <h2 class="section-title"><i class="fas fa-chart-bar"></i> System Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-users">0</h3>
                            <p>Total Users</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="fas fa-comments"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-messages">0</h3>
                            <p>Total Messages</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon yellow"><i class="fas fa-globe"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-posts">0</h3>
                            <p>Forum Posts</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><i class="fas fa-signal"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-online">0</h3>
                            <p>Online Now</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users Tab -->
            <div id="tab-users" class="tab-content active">
                <h2 class="section-title"><i class="fas fa-users"></i> User Management</h2>
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Display Name</th>
                                <th>PIN Code</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Broadcast Tab -->
            <div id="tab-broadcast" class="tab-content">
                <h2 class="section-title"><i class="fas fa-bullhorn"></i> Broadcast Message</h2>
                <div class="settings-section" style="max-width: 600px;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="broadcast-title" placeholder="Announcement title...">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="broadcast-message" rows="4" placeholder="Type your message to all users..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="broadcast-type" style="width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono);">
                            <option value="info">Info (Blue)</option>
                            <option value="success">Success (Green)</option>
                            <option value="error">Warning (Red)</option>
                        </select>
                    </div>
                    <button class="btn-primary" onclick="sendBroadcast()" style="max-width: 200px;">
                        <i class="fas fa-paper-plane"></i> Send Broadcast
                    </button>
                </div>
            </div>

            <!-- Logs Tab -->
            <div id="tab-logs" class="tab-content">
                <h2 class="section-title"><i class="fas fa-history"></i> Admin Action Logs</h2>
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Action</th>
                                <th>Target</th>
                                <th>Admin</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Broadcast Tab -->
            <div id="tab-broadcast" class="tab-content">
                <h2 class="section-title"><i class="fas fa-bullhorn"></i> Broadcast Message</h2>
                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; max-width: 600px;">
                    <div class="form-group">
                        <label>Message Type</label>
                        <select id="broadcast-type" style="width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono);">
                            <option value="info">Info</option>
                            <option value="warning">Warning</option>
                            <option value="success">Success</option>
                            <option value="error">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message Content</label>
                        <textarea id="broadcast-message" rows="4" placeholder="Enter broadcast message for all users..." style="width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); resize: vertical;"></textarea>
                    </div>
                    <button class="btn-primary" onclick="sendBroadcast()" style="width: auto; padding: 12px 30px;">
                        <i class="fas fa-paper-plane"></i> Send Broadcast
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-user-edit"></i> Manage User</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-user-id">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="edit-username" readonly style="background: var(--bg-tertiary); opacity: 0.7;">
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-display-name">
                </div>
                <div class="form-group">
                    <label>PIN Code</label>
                    <input type="text" id="edit-pin-code" readonly style="background: var(--bg-tertiary); opacity: 0.7; color: var(--accent-green);">
                </div>
                <div class="form-group">
                    <label>New Password (leave blank to keep current)</label>
                    <input type="password" id="edit-password" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="edit-banned">
                        <label for="edit-banned">Ban Account</label>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" onclick="saveUserEdit()" style="flex: 1;">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <button class="btn-danger" onclick="deleteUserFromModal()" style="flex: 1;">
                        <i class="fas fa-trash"></i> Delete User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_BASE = '';
        let adminToken = localStorage.getItem('admin_token');
        let currentUsers = [];

        // Check existing session - but require manual login for security
        if (adminToken) {
            // Verify token is still valid by making a test API call
            fetch('/api/admin/stats', {
                headers: { 'Authorization': 'Bearer ' + adminToken }
            })
            .then(r => {
                if (r.ok) {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('dashboard').classList.add('active');
                    loadStats();
                    loadUsers();
                } else {
                    // Token expired or invalid
                    localStorage.removeItem('admin_token');
                    adminToken = null;
                }
            })
            .catch(() => {
                localStorage.removeItem('admin_token');
                adminToken = null;
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function api(endpoint, options = {}) {
            const url = `${API_BASE}/api${endpoint}`;
            const config = {
                headers: { 'Content-Type': 'application/json', ...options.headers },
                ...options
            };
            if (adminToken) config.headers['Authorization'] = `Bearer ${adminToken}`;
            if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);

            const response = await fetch(url, config);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        async function adminLogin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;

            try {
                const data = await api('/admin/login', {
                    method: 'POST',
                    body: { username, password }
                });

                adminToken = data.token;
                localStorage.setItem('admin_token', adminToken);

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');

                showToast('Admin access granted', 'success');
                loadStats();
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function adminLogout() {
            localStorage.removeItem('admin_token');
            adminToken = null;
            location.reload();
        }

        async function sendBroadcast() {
            const type = document.getElementById('broadcast-type').value;
            const message = document.getElementById('broadcast-message').value.trim();

            if (!message) {
                showToast('Message content required', 'error');
                return;
            }

            try {
                await api('/admin/broadcast', {
                    method: 'POST',
                    body: { message, type }
                });
                showToast('Broadcast sent to all users!', 'success');
                document.getElementById('broadcast-message').value = '';
            } catch (error) {
                console.error('Broadcast failed:', error);
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'stats') loadStats();
            if (tab === 'users') loadUsers();
            if (tab === 'logs') loadLogs();
        }

        async function loadStats() {
            try {
                const data = await api('/admin/stats');
                document.getElementById('stat-users').textContent = data.total_users;
                document.getElementById('stat-messages').textContent = data.total_messages;
                document.getElementById('stat-posts').textContent = data.total_posts;
                document.getElementById('stat-online').textContent = data.online_users;
            } catch (error) {
                showToast('Failed to load stats', 'error');
            }
        }

        async function loadUsers() {
            try {
                const data = await api('/admin/users');
                currentUsers = data;
                renderUsers(data);
            } catch (error) {
                showToast('Failed to load users', 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.display_name || '-'}</td>
                    <td><code style="color: var(--accent-green); background: rgba(0,255,65,0.1); padding: 4px 8px; border-radius: 4px;">${user.pin_code}</code></td>
                    <td><span class="status-badge ${user.is_banned ? 'banned' : user.status}">${user.is_banned ? 'BANNED' : user.status.toUpperCase()}</span></td>
                    <td>${new Date(user.created_at).toLocaleDateString()}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-small btn-edit" onclick="editUser(${user.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-small btn-ban" onclick="toggleBan(${user.id}, ${user.is_banned})">
                                <i class="fas fa-ban"></i> ${user.is_banned ? 'Unban' : 'Ban'}
                            </button>
                            <button class="btn-small btn-delete" onclick="deleteUser(${user.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editUser(userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('edit-user-id').value = userId;
            document.getElementById('edit-display-name').value = user.display_name || '';
            document.getElementById('edit-password').value = '';
            document.getElementById('edit-banned').checked = user.is_banned === 1;

            document.getElementById('edit-modal').classList.add('active');
        }

        async function saveUserEdit() {
            const userId = document.getElementById('edit-user-id').value;
            const displayName = document.getElementById('edit-display-name').value;
            const password = document.getElementById('edit-password').value;
            const isBanned = document.getElementById('edit-banned').checked;

            try {
                await api('/admin/user/update', {
                    method: 'POST',
                    body: {
                        user_id: parseInt(userId),
                        display_name: displayName,
                        is_banned: isBanned,
                        new_password: password || undefined
                    }
                });

                showToast('User updated successfully', 'success');
                closeModal();
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function toggleBan(userId, currentStatus) {
            try {
                await api('/admin/user/update', {
                    method: 'POST',
                    body: {
                        user_id: userId,
                        display_name: currentUsers.find(u => u.id === userId)?.display_name || '',
                        is_banned: !currentStatus
                    }
                });

                showToast(`User ${currentStatus ? 'unbanned' : 'banned'}`, 'success');
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure? This action cannot be undone.')) return;

            try {
                await api('/admin/user/delete', {
                    method: 'POST',
                    body: { user_id: userId }
                });

                showToast('User deleted', 'success');
                loadUsers();
                loadStats();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function loadLogs() {
            try {
                const data = await api('/admin/logs');
                const tbody = document.getElementById('logs-table-body');
                tbody.innerHTML = '';

                data.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${new Date(log.created_at).toLocaleString()}</td>
                        <td><span style="color: var(--accent-${log.action.includes('delete') ? 'red' : 'green'});">${log.action.toUpperCase()}</span></td>
                        <td>${log.target_user}</td>
                        <td>${log.admin_username}</td>
                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${log.details}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showToast('Failed to load logs', 'error');
            }
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('edit-modal')) closeModal();
        });

        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') adminLogin();
        });
    </script>
</body>
</html>
